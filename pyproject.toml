[project]
name = "gideon"
version = "0.1.0"
description = "Local voice assistant for Ubuntu - shared project packaging"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Packaging convention (see modules/00-shared/plan.md and ARCHITECTURE.md):
# each module's src/ directory hosts exactly one top-level importable
# package. Register it here so `pip install -e .` (once, from repo root)
# makes every module importable everywhere, e.g. `from shared.interfaces
# import STTEngine`. When a new module is implemented, add one entry to
# each of package-dir and packages below.
[tool.setuptools]
package-dir = { "shared" = "modules/00-shared/src/shared", "audio_io" = "modules/01-audio-io/src/audio_io", "wake_word" = "modules/02-wake-word/src/wake_word", "stt" = "modules/03-stt/src/stt", "llm_client" = "modules/04-llm-client/src/llm_client", "tts" = "modules/05-tts/src/tts", "text_input" = "modules/06-text-input/src/text_input", "orchestrator" = "modules/07-orchestrator/src/orchestrator" }
packages = ["shared", "audio_io", "wake_word", "stt", "llm_client", "tts", "text_input", "orchestrator"]
