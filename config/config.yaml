# See ARCHITECTURE.md for the full schema description and rationale.
# Placeholder values below - each module fills in real choices as it's
# built (record the change in task.md's "open decisions" log too).

audio:
  input_device: default
  output_device: default
  sample_rate: 16000
  frame_ms: 30

wake_word:
  backend: openwakeword
  model: modules/02-wake-word/models/hey_gideon.onnx
  threshold: 0.5

stt:
  backend: faster_whisper
  model_size: small
  device: cpu
  # Live word-by-word preview while you're still speaking, shown by the
  # transcript overlay below. Uses a second, smaller model so it can keep
  # up in real time; the `model_size` model above still produces the final,
  # accurate transcript. Set `partials: false` to reclaim the CPU.
  partials: true
  partial_model_size: tiny

llm:
  backend: ollama
  model: qwen2.5:1.5b
  base_url: http://localhost:11434
  system_prompt: "You are a concise local voice assistant."

tts:
  backend: piper
  voice: en_US-lessac-high

text_input:
  hotkey: null

# On-screen conversation transcript, pinned to the bottom of the screen.
# Appears when the wake word fires, streams both sides of the conversation
# live, and fades out once Gideon has been idle for `hide_after_seconds`.
transcript_ui:
  enabled: false
  autostart: true          # orchestrator starts/stops the overlay process
  socket_path: null        # null = $XDG_RUNTIME_DIR/gideon-transcript.sock
  width: 720               # px, capped at 55% of the monitor width
  bottom_margin: 48        # px above the bottom edge of the screen
  max_turns: 4             # transcript lines kept on screen
  typewriter_cps: 55.0     # reveal speed for streamed replies
  hide_after_seconds: 4.0

orchestrator:
  history_turns: 6
  followup_seconds: 10   # after speaking, how long to keep listening for a
                          # follow-up before requiring the wake word again
